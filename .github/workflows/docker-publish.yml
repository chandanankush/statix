name: Build & Publish statix to Docker Hub

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
  workflow_dispatch:   # manual trigger — skips the debounce wait

# Only one run active at a time. A newer push cancels the waiting run,
# so only the last commit in any 15-minute burst gets built.
concurrency:
  group: docker-publish
  cancel-in-progress: true

env:
  IMAGE: midnightappcoder/statix

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Debounce — wait 15 min for additional pushes
        if: github.event_name == 'push'
        run: sleep 900

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
